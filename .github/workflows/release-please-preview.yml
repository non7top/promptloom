name: release-please-preview

on:
  pull_request:
    # edited fires on a title/body/base-branch change with no new commits.
    # This repo merges via real merge commits (not squash), so the PR
    # title itself doesn't feed release-please's changelog/version
    # computation — but retargeting a PR's base branch onto (or off of)
    # master does change whether it should be previewed at all, and that's
    # also delivered as `edited`, not `synchronize`. A real rebase/
    # force-push already re-triggers via synchronize on its own.
    types: [opened, synchronize, reopened, edited]
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: release-please needs to walk back to the
          # last release tag, and the action builds its own merge commit on
          # top of this clone.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Back on the moving @v1 tag. Pinning to v1.1.0 was the workaround for
      # release-please-forecast#4, but v1.1.0 predates the fix for
      # release-please-forecast#2, so the pin is what left this repo's own
      # release PRs predicting 1.0.0 (promptloom#107). @v1 points at v1.2.0,
      # which has that fix and still has the bump-type output this workflow
      # relies on to recolor the RELEASE label.
      - uses: non7top/release-please-forecast@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
