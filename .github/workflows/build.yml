name: Build

on:
  push:
    branches: [master]
  pull_request:
    # `edited` isn't in GitHub's defaults, and this workflow needs it: the
    # predicted version below names this PR's artifacts, and the prediction
    # reads the PR title (which is what GitHub puts in the merge commit
    # body). Retitle a PR without this and no run happens, so the installer
    # keeps the previous prediction's version in its filename.
    types: [opened, synchronize, reopened, edited]
    branches: [master]

jobs:
  # One job, not the old lint-on-Linux + package-on-Windows pair. The
  # Windows installer cross-builds under Wine (see Dockerfile.win), which
  # removes the only reason a Windows runner was involved — and Windows
  # minutes bill at 1.67x Linux. Chaining also means a single checkout and
  # a single `npm ci` feed the lint, type-check, bundle and package steps,
  # instead of each runner installing the tree for itself.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Needed for the cosign dry-run below to mint a Fulcio cert via OIDC.
      id-token: write
    env:
      # Run every containerised step in the Wine image rather than pulling
      # the dev image as well. Nothing in CI launches the app, so the dev
      # image's xvfb + Chromium runtime libs are dead weight here, and both
      # images are node 24 — so this is one image, one `npm ci`, one
      # node_modules. `make` picks this up via `SERVICE ?= dev`.
      SERVICE: win
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: release-please-forecast needs to walk back
          # to the last release tag and build its own merge commit on top
          # of this clone.
          fetch-depth: 0

      # Recorded before release-please-forecast moves HEAD around, so the
      # build below can return to exactly what was checked out here — the
      # PR merged into master, for a pull_request event.
      - name: Record the checked-out commit
        id: checked_out
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The only image CI builds. No buildx layer cache on it deliberately:
      # it's a single chown on top of upstream's Wine image, so essentially
      # all of its cost is pulling that ~1.5GB base — which a layer cache
      # doesn't avoid, and which `--load` would make worse by re-exporting
      # it into the daemon. Measured 96s, the largest step in the job; if
      # that needs to come down, a slim prebuilt image on GHCR is the
      # lever, not a layer cache.
      - name: Build Windows cross-build image
        run: make image-win

      - name: Install dependencies
        run: make install

      - name: Lint and type-check
        run: make check

      # post-comment: false — this action's own PR comment/RELEASE-label
      # side effects are release-please-preview.yml's job; here we only
      # want the predicted version, to name this PR's build artifacts.
      #
      # This was the single most expensive step in the old pipeline (114s)
      # and the least Windows-specific: it only walks git history and
      # simulates a release-please run.
      - name: Predict next version
        id: predict
        if: github.event_name == 'pull_request'
        # Back on the moving @v1 tag. Pinning to v1.1.0 was the workaround
        # for release-please-forecast#4, but v1.1.0 predates the fix for
        # release-please-forecast#2 — so it was the pin that made this
        # repo's own release PRs predict 1.0.0 instead of the real version
        # (see promptloom#107). @v1 now points at v1.2.0, which has that
        # fix, and release-please-forecast#6 moves the major tag from CI on
        # every release rather than leaving it to be done by hand.
        uses: non7top/release-please-forecast@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          post-comment: 'false'

      # The action above leaves the working tree on its own synthetic
      # preview-merge branch (or, if simulating the merge failed, on
      # unmerged master) to compute the prediction, so the tree has to be
      # put back before building.
      #
      # Back to what actions/checkout produced, NOT to `preview-head`.
      # preview-head is the PR branch tip *without* the base merged in, so a
      # branch cut before some change landed on master builds without that
      # change — which is how a PR opened before the Makefile existed failed
      # with "make: *** No rule to make target 'win'" (promptloom#125) even
      # though master had the Makefile. For a pull_request event
      # actions/checkout checks out refs/pull/N/merge, i.e. the PR already
      # merged into master, which is what should actually be built and
      # tested. The SHA is captured rather than using github.sha so this
      # keeps working regardless of what the forecast action does to refs.
      - name: Restore the merge result for the build
        if: github.event_name == 'pull_request'
        run: git checkout ${{ steps.checked_out.outputs.sha }}

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # `make win` bundles into out/ first, then runs electron-builder
      # --win under Wine. Reuses the node_modules the install step above
      # populated rather than installing again.
      - name: Package Windows installer
        run: make win

      - uses: sigstore/cosign-installer@v4.1.2

      # This PR build never becomes a real release, so there's nothing to
      # attach this to — it exists purely to prove the keyless sign/verify
      # invocation used in release.yml actually works against a real
      # installer file before that (CI-unverifiable) step ever runs for
      # real. See release.yml for the step that matters.
      - name: Cosign sign/verify dry run
        run: |
          EXE_PATH=$(find dist -maxdepth 1 -name '*.exe' | head -1)
          cosign sign-blob --yes --bundle "$EXE_PATH.cosign.bundle" "$EXE_PATH"
          cosign verify-blob --bundle "$EXE_PATH.cosign.bundle" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$EXE_PATH"

      # Only meaningful for PR builds with a predicted release — plain
      # pushes to master (already merged, not previewing anything) and
      # no-releasable-change PRs keep the plain glob path below instead.
      # electron-builder's NSIS target produces a single Setup .exe (no
      # separate .nupkg/RELEASES — those were Squirrel-specific update-feed
      # files; this app has no in-app auto-updater consuming them).
      - name: Rename build artifact to the predicted version
        id: artifact_names
        if: github.event_name == 'pull_request' && steps.predict.outputs.version != ''
        run: |
          VERSION_TAG="${{ steps.predict.outputs.version }}-rc${{ github.event.pull_request.number }}"
          EXE_PATH=$(find dist -maxdepth 1 -name '*.exe' | head -1)
          NEW_EXE="$(dirname "$EXE_PATH")/promptloom-installer-${VERSION_TAG}.exe"
          mv "$EXE_PATH" "$NEW_EXE"

          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "exe_path=$NEW_EXE" >> "$GITHUB_OUTPUT"

      - name: Upload installer (Setup.exe)
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          # `name` is ignored by the action whenever archive: false — the
          # artifact takes the name of the file it's given instead, so the
          # rename step above (when it ran) is what actually names this.
          path: ${{ steps.artifact_names.outputs.exe_path || 'dist/*.exe' }}
          retention-days: 14
          # Skip the action's own zip wrapper entirely rather than just
          # turning off its compression — Setup.exe is already a compressed
          # archive internally, so both were pure overhead.
          archive: false

      - name: Comment download link on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL_SUFFIX="${{ steps.artifact_names.outputs.version_tag || steps.vars.outputs.sha_short }}"
          gh pr comment "${{ github.event.pull_request.number }}" --body "Windows build ready for \`${{ steps.vars.outputs.sha_short }}\`:
          - [promptloom-installer-${LABEL_SUFFIX}](${{ steps.upload-installer.outputs.artifact-url }})"
