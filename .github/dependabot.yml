version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # "deps" categorizes dependency bumps under Dependencies in the changelog.
    commit-message:
      prefix: "deps"
      prefix-development: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
